
#Wand settings
[wand]
	#The item ID to use as the selection wand. Default: minecraft:wooden_sword
	item = "minecraft:wooden_sword"

#Logging settings
[logging]
	#Enable file logging. If false, logs will not be written to files.
	enableLogs = true
	#Number of days to keep log files before deleting them. Default: 30 days.
	#Range: 1 ~ 365
	logRetentionDays = 30

#Zone manager permissions
[managerPermissions]
	#If false, zone managers cannot access plots (break, place, etc.) and cannot delete or modify claimed plots. They can still create plots and change prices. Default: false
	canAccessPlots = false

#Plot price settings
[plotPrice]
	#The type of currency used for plot pricing. Options: OFF, SDM_SHOP, ECONOMY_PLUS, ITEM. Default: OFF
	priceType = "OFF"
	#The minimum price per block for plots when using SDM_SHOP or ECONOMY_PLUS. Default: 0.0 (disabled)
	#Range: 0.0 ~ 1.7976931348623157E308
	pricePerBlock = 0.0
	#Default currency item for the ITEM price type, stored as SNBT (includes NBT data).
	#Example: {id:"minecraft:diamond",Count:1b} or with NBT: {id:"minecraft:enchanted_book",Count:1b,tag:{...}}
	#Set via /wg plots manage setdefaultitem (hold the item in your main hand).
	#Leave empty to use no default item.
	defaultItemSnbt = ""
	#If true, ALL plots must use the default item (defaultItemSnbt) as currency.
	#Per-plot item overrides set via /wg plots manage changeprice will be ignored for payment.
	#NOTE: Changing this setting requires a SERVER RESTART to take effect on commands.
	#The command argument structure (item vs qty-only) is built once at startup.
	#Default: false
	defaultItemOnly = false

#World Claims settings
[worldClaims]
	#Enable the /worldclaims command and all base-claiming functionality.
	#NOTE: Disabling this will disable ALL claims — players will not be able to
	#claim bases, and the /worldclaims command will be hidden from non-op players.
	#Op players can still run /worldclaims when disabled and will see a message
	#directing them to enable it here. Default: false
	enabled = false
	#The type of claiming system to use.
	#  BLOCK - Players select 2 corner points with the claim wand to define a cuboid claim area.
	#  CHUNK - Players claim entire chunks at a time.
	#Default: BLOCK
	claimType = "BLOCK"
	#Number of claim blocks (or chunks when claimType = CHUNK) a player receives on first join.
	#For BLOCK mode this is the total volume (X * Y * Z) a player may claim.
	#For CHUNK mode this is the number of chunks a player may claim.
	#Range: 0 ~ 10000000. Default: 500
	#Range: 0 ~ 10000000
	defaultClaimBlocks = 500

#Debug settings
[debug]
	#When true (default), server operators bypass all zone flag restrictions.
	#Set to false to make OPs subject to zone flags like regular players.
	#Can also be toggled at runtime with /wg debug opbypass (saves immediately).
	#Default: true
	opBypassFlags = true

#Rent settings
[rent]
	#Number of days between rent collections. Default: 14
	#Range: 1 ~ 365
	rentPeriodDays = 14
	#Percentage of rent/purchase that is deleted as server tax (0-100). Default: 0.
	#Note: This only applies when using SDM_SHOP or ECONOMY_PLUS (money). Items are not taxed.
	#Range: 0 ~ 100
	adminTaxPercentage = 0

